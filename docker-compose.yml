services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudshield}
      POSTGRES_USER: ${POSTGRES_USER:-cloudshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cloudshield}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-cloudshield}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  seed:
    image: postgres:16-alpine
    environment:
      PGDATABASE: ${POSTGRES_DB:-cloudshield}
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      PGUSER: ${POSTGRES_USER:-cloudshield}
    volumes:
      - ./seed.sql:/seed.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -f /seed.sql"]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cloudshield}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-cloudshield}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data: